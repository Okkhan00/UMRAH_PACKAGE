<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umrah Package Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== TEMPLATE GALLERY (ENTRY SCREEN) ===================== -->
<div id="gallery" class="gallery">
  <div class="gallery-inner">
    <div class="gallery-head">
      <span class="gallery-kicker">Umrah Package Studio</span>
      <h1>Start from a template, then make it yours</h1>
      <p>Every template is fully editable — swap colors, hotels, prices and copy once you're inside the studio.</p>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <button class="gallery-custom-btn" id="createCustomBtn">+ Create custom template</button>

    <div class="gallery-library">
      <div class="gallery-library-head">
        <h2>Saved packages</h2>
        <span id="libraryCount" class="muted-tag"></span>
      </div>
      <div class="gallery-library-list" id="libraryList"></div>
    </div>
  </div>
</div>

<!-- ===================== MAIN STUDIO APP ===================== -->
<div id="studio" class="studio hidden">

  <!-- TOP TOOLBAR -->
  <header class="toolbar">
    <div class="toolbar-left">
      <button class="tb-btn tb-icon" id="btnBack" title="Back to templates">←</button>
      <input id="packageNameTop" class="pkg-title-input" value="Untitled Package" />
      <span id="autosaveIndicator" class="autosave-indicator">Saved ✓</span>
    </div>
    <div class="toolbar-right">
      <button class="tb-btn" id="btnNew">New</button>
      <button class="tb-btn" id="btnSave">Save</button>
      <button class="tb-btn" id="btnDuplicate">Duplicate</button>
      <button class="tb-btn" id="btnPreviewToggle">Preview</button>
      <div class="tb-dropdown">
        <button class="tb-btn tb-primary" id="btnExportMenu">Export ▾</button>
        <div class="tb-dropdown-menu" id="exportMenu">
          <button data-action="print">Print</button>
          <button data-action="pdf">Export PDF</button>
          <button data-action="png">Export PNG</button>
          <button data-action="jpg">Export JPG</button>
        </div>
      </div>
      <button class="tb-btn tb-danger" id="btnReset">Reset</button>
    </div>
  </header>

  <div class="app-body">
    <!-- MOBILE DRAWER TOGGLE -->
    <button class="drawer-toggle" id="drawerToggle">Edit ✎</button>

    <!-- LEFT EDITOR PANEL -->
    <aside class="editor" id="editorPanel">
      <nav class="editor-tabs" id="editorTabs"></nav>
      <div class="editor-body" id="editorBody"></div>
    </aside>

    <!-- CENTER PREVIEW -->
    <main class="preview-wrap">
      <div class="preview-toolbar">
        <div class="page-size-select">
          <label for="pageSize">Export size</label>
          <select id="pageSize">
            <option value="a4p">A4 Portrait</option>
            <option value="a4l">A4 Landscape</option>
            <option value="a3">A3</option>
            <option value="1080x1350">1080 × 1350 (Instagram)</option>
            <option value="1080x1920">1080 × 1920 (Story)</option>
            <option value="custom">Custom</option>
          </select>
          <div id="customSizeInputs" class="custom-size-inputs hidden">
            <input type="number" id="customW" placeholder="W px" />
            <input type="number" id="customH" placeholder="H px" />
          </div>
        </div>
        <button class="tb-btn" id="btnPrintPreview">Print Preview</button>
      </div>
      <div class="preview-scroll">
        <div class="poster-frame" id="posterFrame">
          <div class="poster" id="poster"><!-- rendered by JS --></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- PRINT PREVIEW MODAL -->
<div id="printModal" class="modal hidden">
  <div class="modal-inner print-modal-inner">
    <div class="modal-head">
      <h3>Print Preview — fits one A4 page</h3>
      <button class="modal-close" id="closePrintModal">✕</button>
    </div>
    <div class="print-modal-body">
      <div class="poster-frame a4-frame" id="printFrame"></div>
    </div>
    <div class="modal-foot">
      <button class="tb-btn tb-primary" id="doActualPrint">Print now</button>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div id="toastHost" class="toast-host"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
